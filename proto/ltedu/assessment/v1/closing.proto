syntax = "proto3";

// Year and semester closing (phase 7 of docs/plan-academico.md). Situations: PRO (promovido), PER (permanece), RR
// (recuperación pedagógica), PEN (levels missing). IEST unit statuses: approved | recovery | failed | barred
package joseph.assessment.v1;

import "joseph/academic/v1/academic.proto";
import "joseph/assessment/v1/assessment.proto";

option go_package = "api/internal/adapter/inbound/grpc/gen/assessmentv1;assessmentv1";

// Dirección and coordinación close; secretaría reads, prints the actas and exports
service ClosingService {
  rpc GetClosing(GetClosingRequest) returns (GetClosingResponse);
  rpc GetSectionClosing(GetSectionClosingRequest) returns (GetSectionClosingResponse);
  // The evaluation team's situation for a student (empty: back to the rules), with its reason
  rpc DecideSituation(DecideSituationRequest) returns (DecideSituationResponse);
  rpc ConfirmSection(ConfirmSectionRequest) returns (ConfirmSectionResponse);
  rpc SaveRecovery(SaveRecoveryRequest) returns (SaveRecoveryResponse);
  rpc GetUnitClosing(GetUnitClosingRequest) returns (GetUnitClosingResponse);
  rpc ConfirmUnit(ConfirmUnitRequest) returns (ConfirmUnitResponse);
  rpc SaveUnitRecovery(SaveUnitRecoveryRequest) returns (SaveUnitRecoveryResponse);
  // kind: final | complementary (section) | unit (assignment)
  rpc IssueRecord(IssueRecordRequest) returns (IssueRecordResponse);
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);
  // CSV for SIAGIE (section) or the unit's results (assignment)
  rpc ExportResults(ExportResultsRequest) returns (ExportResultsResponse);

  // EBA (phase E7): the promotion rule of each cycle, set by the CEBA (decision D4), and the SIAGIE loading state
  // of the final grades of each student
  rpc GetPromotionRules(GetPromotionRulesRequest) returns (GetPromotionRulesResponse);
  rpc SavePromotionRule(SavePromotionRuleRequest) returns (SavePromotionRuleResponse);
  rpc ResetPromotionRule(ResetPromotionRuleRequest) returns (ResetPromotionRuleResponse);
  // Every student of the section when student_ids is empty; observed needs the note
  rpc SetSiagieGrades(SetSiagieGradesRequest) returns (SetSiagieGradesResponse);
}

message RecordInfo {
  string id = 1;
  string section_id = 2;
  string section_label = 3;
  string assignment_id = 4;
  string kind = 5;
  int32 number = 6;
  string code = 7;
  // issued | replaced
  string status = 8;
  string issued_name = 9;
  string issued_at = 10;
  // Phase E7: the newest signed version of the acta (empty until generated) and its state
  string act_version_id = 11;
  string act_status = 12;
}

message SectionClosingSummary {
  string section_id = 1;
  string label = 2;
  int32 students = 3;
  map<string, int32> counts = 4;
  int32 confirmed = 5;
  int32 recovered = 6;
}

message UnitClosingSummary {
  string assignment_id = 1;
  string section_id = 2;
  string section_label = 3;
  string subject_name = 4;
  string staff_name = 5;
  int32 students = 6;
  bool confirmed = 7;
  map<string, int32> counts = 8;
}

message GetClosingRequest {
  string institution_slug = 1;
  string period_id = 2;
}

message GetClosingResponse {
  // basic | units
  string mode = 1;
  repeated joseph.academic.v1.Period periods = 2;
  joseph.academic.v1.Period period = 3;
  bool last_term_closed = 4;
  bool can_manage = 5;
  repeated SectionClosingSummary sections = 6;
  repeated UnitClosingSummary units = 7;
  repeated RecordInfo records = 8;
}

message ClosingArea {
  string subject_id = 1;
  string name = 2;
  repeated Competency competencies = 3;
  string subject_code = 4;
}

message ClosingRow {
  StudentRef student = 1;
  map<string, string> final = 2;
  string computed = 3;
  string reason = 4;
  string decided = 5;
  string decision_note = 6;
  string decided_name = 7;
  string situation = 8;
  bool confirmed = 9;
  repeated string targets = 10;
  map<string, string> recovery = 11;
  string after_recovery = 12;
  // Phase E7: the student's own grade (multigrade sections), the Religion exemption (its cells read EXO) and the
  // SIAGIE state of the grades: pending | exported | observed
  string enrollment_id = 13;
  string grade_short = 14;
  bool religion_exempt = 15;
  string siagie_status = 16;
  string siagie_note = 17;
  string siagie_at = 18;
}

message SectionClosing {
  string section_id = 1;
  string section_label = 2;
  string level_name = 3;
  string tutor_name = 4;
  string period_id = 5;
  string period_name = 6;
  string rule = 7;
  bool referential = 8;
  bool automatic = 9;
  bool last_term_closed = 10;
  bool can_manage = 11;
  repeated ClosingArea areas = 12;
  repeated ClosingRow rows = 13;
  repeated RecordInfo records = 14;
}

message GetSectionClosingRequest {
  string institution_slug = 1;
  string section_id = 2;
}

message GetSectionClosingResponse {
  SectionClosing closing = 1;
}

message DecideSituationRequest {
  string institution_slug = 1;
  string section_id = 2;
  string student_id = 3;
  string situation = 4;
  string note = 5;
}

message DecideSituationResponse {
  SectionClosing closing = 1;
}

message ConfirmSectionRequest {
  string institution_slug = 1;
  string section_id = 2;
}

message ConfirmSectionResponse {
  SectionClosing closing = 1;
}

message SaveRecoveryRequest {
  string institution_slug = 1;
  string section_id = 2;
  string student_id = 3;
  // competency id → level ('' clears)
  map<string, string> levels = 4;
}

message SaveRecoveryResponse {
  SectionClosing closing = 1;
}

message UnitRow {
  StudentRef student = 1;
  map<string, int32> scores = 2;
  optional double average = 3;
  optional int32 grade = 4;
  int32 missing = 5;
  double absent_percent = 6;
  string status = 7;
  optional int32 recovery_score = 8;
  optional int32 final_grade = 9;
  bool confirmed = 10;
}

message UnitClosing {
  string assignment_id = 1;
  string subject_name = 2;
  string staff_name = 3;
  string section_id = 4;
  string section_label = 5;
  string level_name = 6;
  string period_name = 7;
  int32 passing_grade = 8;
  int32 absence_limit = 9;
  bool can_manage = 10;
  repeated Evaluation evaluations = 11;
  repeated UnitRow rows = 12;
  repeated RecordInfo records = 13;
}

message GetUnitClosingRequest {
  string institution_slug = 1;
  string assignment_id = 2;
}

message GetUnitClosingResponse {
  UnitClosing closing = 1;
}

message ConfirmUnitRequest {
  string institution_slug = 1;
  string assignment_id = 2;
}

message ConfirmUnitResponse {
  UnitClosing closing = 1;
}

message SaveUnitRecoveryRequest {
  string institution_slug = 1;
  string assignment_id = 2;
  string student_id = 3;
  // Not set: clear it
  optional int32 score = 4;
}

message SaveUnitRecoveryResponse {
  UnitClosing closing = 1;
}

message IssueRecordRequest {
  string institution_slug = 1;
  string section_id = 2;
  string assignment_id = 3;
  string kind = 4;
}

message IssueRecordResponse {
  RecordInfo record = 1;
}

message GetRecordRequest {
  string institution_slug = 1;
  string id = 2;
}

message GetRecordResponse {
  RecordInfo record = 1;
  // The frozen acta as JSON (title, institution, groups, rows, summary, legend, signatures…)
  string content = 2;
}

message ExportResultsRequest {
  string institution_slug = 1;
  string section_id = 2;
  string assignment_id = 3;
}

message ExportResultsResponse {
  string file_name = 1;
  bytes content = 2;
}

message PromotionRule {
  string level_id = 1;
  string level_code = 2;
  string level_name = 3;
  bool automatic = 4;
  int32 areas = 5;
  string note = 6;
  // false: the rule of the code (default_*)
  bool custom = 7;
  string updated_name = 8;
  string updated_at = 9;
  string default_name = 10;
  int32 default_areas = 11;
  bool default_automatic = 12;
}

message GetPromotionRulesRequest {
  string institution_slug = 1;
}

message GetPromotionRulesResponse {
  repeated PromotionRule rules = 1;
  bool can_manage = 2;
}

message SavePromotionRuleRequest {
  string institution_slug = 1;
  string level_id = 2;
  bool automatic = 3;
  int32 areas = 4;
  string note = 5;
}

message SavePromotionRuleResponse {
  repeated PromotionRule rules = 1;
  bool can_manage = 2;
}

message ResetPromotionRuleRequest {
  string institution_slug = 1;
  string level_id = 2;
}

message ResetPromotionRuleResponse {
  repeated PromotionRule rules = 1;
  bool can_manage = 2;
}

message SetSiagieGradesRequest {
  string institution_slug = 1;
  string section_id = 2;
  repeated string student_ids = 3;
  string status = 4;
  string note = 5;
}

message SetSiagieGradesResponse {
  SectionClosing section = 1;
}
