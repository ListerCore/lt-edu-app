syntax = "proto3";

// Service state, called by lt-edu-app's server over the internal network. Mirrors GET /api/v1/health
package ltedu.system.v1;

import "google/protobuf/timestamp.proto";

option go_package = "api/internal/adapter/inbound/grpc/gen/systemv1;systemv1";

// Metadata every call may carry:
//   x-forwarded-for: <visitor IP>        (honoured only from trusted proxies, like the HTTP API)
//   x-user-agent: <visitor user agent>   (logs and rate limits)
//
// Failed calls return a gRPC status whose details hold one ltedu.common.v1.ErrorDetail
service SystemService {
  // Overall state plus, when asked, the database and Redis
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);
}

message GetHealthRequest {
  bool include_db = 1;
  bool include_redis = 2;
}

message ComponentStatus {
  // ok | degraded
  string status = 1;
  // Round trip of the ping, e.g. "1.2ms"
  string latency = 2;
}

message GetHealthResponse {
  // ok | degraded
  string status = 1;
  string service = 2;
  google.protobuf.Timestamp timestamp = 3;
  // Set only when asked for
  optional ComponentStatus db = 4;
  optional ComponentStatus redis = 5;
}
