syntax = "proto3";

// Study plans (phase 2 of docs/plan-academico.md): versions per level, at most one in force, with their areas and
// CNEB competencies (Educación Básica), courses and topics (CEPRE), or formative modules, didactic units with
// credits and capacities, and EFSRT (institutes). Same metadata, scoping and permissions as AcademicService
package ltedu.academic.v1;

import "ltedu/academic/v1/academic.proto";

option go_package = "api/internal/adapter/inbound/grpc/gen/academicv1;academicv1";

service CurriculumService {
  // Every plan of the institution with the levels they belong to
  rpc ListCurricula(ListCurriculaRequest) returns (ListCurriculaResponse);
  rpc GetCurriculum(GetCurriculumRequest) returns (GetCurriculumResponse);
  // A new draft for a level, empty or from the suggested plan of its kind
  rpc CreateCurriculum(CreateCurriculumRequest) returns (CreateCurriculumResponse);
  // A new draft copied from another plan: the way to prepare the next version
  rpc DuplicateCurriculum(DuplicateCurriculumRequest) returns (DuplicateCurriculumResponse);
  rpc UpdateCurriculum(UpdateCurriculumRequest) returns (UpdateCurriculumResponse);
  // draft → active (archives the one in force), active → archived, archived → active
  rpc SetCurriculumStatus(SetCurriculumStatusRequest) returns (SetCurriculumStatusResponse);
  // Drafts only
  rpc DeleteCurriculum(DeleteCurriculumRequest) returns (DeleteCurriculumResponse);

  rpc CreateModule(CreateModuleRequest) returns (CreateModuleResponse);
  rpc UpdateModule(UpdateModuleRequest) returns (UpdateModuleResponse);
  rpc DeleteModule(DeleteModuleRequest) returns (DeleteModuleResponse);

  rpc CreateSubject(CreateSubjectRequest) returns (CreateSubjectResponse);
  rpc UpdateSubject(UpdateSubjectRequest) returns (UpdateSubjectResponse);
  rpc DeleteSubject(DeleteSubjectRequest) returns (DeleteSubjectResponse);
  rpc ReorderSubjects(ReorderSubjectsRequest) returns (ReorderSubjectsResponse);

  rpc CreateCompetency(CreateCompetencyRequest) returns (CreateCompetencyResponse);
  rpc UpdateCompetency(UpdateCompetencyRequest) returns (UpdateCompetencyResponse);
  rpc DeleteCompetency(DeleteCompetencyRequest) returns (DeleteCompetencyResponse);
  rpc ReorderCompetencies(ReorderCompetenciesRequest) returns (ReorderCompetenciesResponse);
}

message Competency {
  string id = 1;
  // Empty for transversal competencies
  string subject_id = 2;
  // competency | capacity | topic
  string kind = 3;
  string code = 4;
  string name = 5;
  int32 position = 6;
}

message Subject {
  string id = 1;
  string module_id = 2;
  // area | workshop | tutoring | course | unit | efsrt
  string kind = 3;
  // specific | employability | efsrt (institutes)
  string component = 4;
  string code = 5;
  string name = 6;
  string description = 7;
  optional int32 weekly_hours = 8;
  optional int32 theory_credits = 9;
  optional int32 practice_credits = 10;
  int32 position = 11;
  repeated string grade_ids = 12;
  repeated Competency competencies = 13;
}

message Module {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  int32 position = 5;
}

message Curriculum {
  string id = 1;
  string level_id = 2;
  string level_name = 3;
  string name = 4;
  string notes = 5;
  // draft | active | archived
  string status = 6;
  // RFC 3339, empty until it first comes into force
  string activated_at = 7;
  string updated_at = 8;
  int32 subject_count = 9;
  int32 total_credits = 10;
  // Filled by GetCurriculum only
  repeated Module modules = 11;
  repeated Subject subjects = 12;
  repeated Competency transversal = 13;
}

message SubjectInput {
  string module_id = 1;
  string kind = 2;
  string component = 3;
  string code = 4;
  string name = 5;
  string description = 6;
  optional int32 weekly_hours = 7;
  optional int32 theory_credits = 8;
  optional int32 practice_credits = 9;
  repeated string grade_ids = 10;
}

message ListCurriculaRequest {
  string institution_slug = 1;
}

message ListCurriculaResponse {
  AcademicContext context = 1;
  repeated Level levels = 2;
  repeated Curriculum curricula = 3;
  // Levels that have a suggested plan to start from
  repeated string template_level_ids = 4;
}

message GetCurriculumRequest {
  string institution_slug = 1;
  string id = 2;
}

message GetCurriculumResponse {
  AcademicContext context = 1;
  Curriculum curriculum = 2;
  // The level the plan belongs to, with its grades
  Level level = 3;
}

message CreateCurriculumRequest {
  string institution_slug = 1;
  string level_id = 2;
  // Empty: the template's name, or "Plan de estudios <year>"
  string name = 3;
  bool from_template = 4;
}

message CreateCurriculumResponse {
  Curriculum curriculum = 1;
}

message DuplicateCurriculumRequest {
  string institution_slug = 1;
  string id = 2;
  string name = 3;
}

message DuplicateCurriculumResponse {
  Curriculum curriculum = 1;
}

message UpdateCurriculumRequest {
  string institution_slug = 1;
  string id = 2;
  string name = 3;
  string notes = 4;
}

message UpdateCurriculumResponse {
  Curriculum curriculum = 1;
}

message SetCurriculumStatusRequest {
  string institution_slug = 1;
  string id = 2;
  string status = 3;
}

message SetCurriculumStatusResponse {
  Curriculum curriculum = 1;
}

message DeleteCurriculumRequest {
  string institution_slug = 1;
  string id = 2;
}

message DeleteCurriculumResponse {}

message CreateModuleRequest {
  string institution_slug = 1;
  string curriculum_id = 2;
  string code = 3;
  string name = 4;
  string description = 5;
}

message CreateModuleResponse {
  Module module = 1;
}

message UpdateModuleRequest {
  string institution_slug = 1;
  string id = 2;
  string code = 3;
  string name = 4;
  string description = 5;
}

message UpdateModuleResponse {
  Module module = 1;
}

message DeleteModuleRequest {
  string institution_slug = 1;
  string id = 2;
}

message DeleteModuleResponse {}

message CreateSubjectRequest {
  string institution_slug = 1;
  string curriculum_id = 2;
  SubjectInput subject = 3;
}

message CreateSubjectResponse {
  Subject subject = 1;
}

message UpdateSubjectRequest {
  string institution_slug = 1;
  string id = 2;
  SubjectInput subject = 3;
}

message UpdateSubjectResponse {
  Subject subject = 1;
}

message DeleteSubjectRequest {
  string institution_slug = 1;
  string id = 2;
}

message DeleteSubjectResponse {}

message ReorderSubjectsRequest {
  string institution_slug = 1;
  string curriculum_id = 2;
  repeated string ids = 3;
}

message ReorderSubjectsResponse {}

message CreateCompetencyRequest {
  string institution_slug = 1;
  string curriculum_id = 2;
  // Empty: transversal (Educación Básica only)
  string subject_id = 3;
  string code = 4;
  string name = 5;
}

message CreateCompetencyResponse {
  Competency competency = 1;
}

message UpdateCompetencyRequest {
  string institution_slug = 1;
  string id = 2;
  string code = 3;
  string name = 4;
}

message UpdateCompetencyResponse {
  Competency competency = 1;
}

message DeleteCompetencyRequest {
  string institution_slug = 1;
  string id = 2;
}

message DeleteCompetencyResponse {}

message ReorderCompetenciesRequest {
  string institution_slug = 1;
  string curriculum_id = 2;
  // Empty: the transversal ones
  string subject_id = 3;
  repeated string ids = 4;
}

message ReorderCompetenciesResponse {}
