// Copy of googleapis google/rpc/status.proto (Apache 2.0): the rich error model gRPC servers put in
// grpc-status-details-bin. lister-app only needs it to read lister-api's ErrorDetail
syntax = "proto3";

package google.rpc;

import "google/protobuf/any.proto";

message Status {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}
